spring:
  application:
    name: transaction-service

  profiles:
    # Running without -Dspring.profiles.active is a developer's machine, so the plain
    # console pattern applies and structured JSON is reserved for deployed profiles.
    default: local

  threads:
    virtual:
      enabled: true

  config:
    # Centrally tuned values come from config-server when it is up (infra/config-repo);
    # without it the packaged defaults apply and startup is unaffected.
    import: "optional:configserver:${SPENDLY_CONFIG_SERVER_URL:http://localhost:8888}"

  datasource:
    url: ${SPENDLY_TRANSACTION_DB_URL:jdbc:postgresql://localhost:5432/spendly_transaction}
    username: ${SPENDLY_DB_USER}
    password: ${SPENDLY_DB_PASSWORD}
    hikari:
      pool-name: spendly-transaction-pool
      # Sized, not defaulted. The feed query is the hot path and every write is one short
      # insert, so the pool covers concurrent readers rather than long transactions. Raise
      # it against a measured wait time, not a guess.
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 3000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        hbm2ddl:
          # pgjdbc reports a declaratively partitioned table as "PARTITIONED TABLE", which
          # the schema validator would otherwise report as missing.
          extra_physical_table_types: PARTITIONED TABLE

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  kafka:
    bootstrap-servers: ${SPENDLY_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      # The event topics keep every record, so a read model can be rebuilt by replaying one; this applies
      # that retention to a topic that already existed with the broker default.
      modify-topic-configs: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: transaction-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPENDLY_OIDC_ISSUER}
          # The signing keys come from auth-service's JWKS, never from OIDC discovery (it serves none);
          # the issuer is the name `iss` must equal, and SPENDLY_OIDC_ISSUER is the one value auth-service signs with.
          jwk-set-uri: ${SPENDLY_OIDC_JWK_SET_URI:http://localhost:8096/.well-known/jwks.json}
          audiences:
            - spendly-api

server:
  port: ${SERVER_PORT:8084}
  # Behind the gateway, Location headers must name the gateway, not this container.
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

spendly:
  # Seeds the demo dataset for dev@spendly.local on startup: common.demo.DemoData defines it,
  # each service's demo.TestDataGenerator writes its own slice. Idempotent, and forced off in
  # every deployed profile below. See common.demo.DemoDataProperties.
  demo-data:
    enabled: ${SPENDLY_DEMO_DATA:true}
    # Wipe this owner's demo rows before seeding, so a reshaped dataset replaces the old one.
    reset: ${SPENDLY_DEMO_DATA_RESET:false}
    # How many months of history to generate, ending with the current month.
    months: ${SPENDLY_DEMO_DATA_MONTHS:4}
    # Percentage applied to every seeded amount: 100 is as written, 250 is two and a half times.
    scale-percent: ${SPENDLY_DEMO_DATA_SCALE:100}
  cors:
    allowed-origins: ${SPENDLY_CORS_ORIGINS:http://localhost:4200}
  dead-letters:
    enabled: true
  outbox:
    mode: ${SPENDLY_OUTBOX_MODE:poller}
    # The relay polls outbox_event with SKIP LOCKED and ships rows to Kafka (CLAUDE.md 6.5).
    poll-interval: PT1S

eureka:
  client:
    # On by default in compose (SPENDLY_EUREKA_ENABLED); a service started from the IDE
    # is reachable by DNS/localhost and need not register.
    enabled: ${SPENDLY_EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${SPENDLY_EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  server:
    # Actuator lives on its own connector so the public port exposes no ops surface at all.
    # In compose and k8s this port is reachable inside the network only.
    port: ${MANAGEMENT_PORT:9084}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      # Everything locally; a deployed profile lowers this.
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${SPENDLY_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    com.spendly: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-no-correlation-id}] %logger{36} - %msg%n"

---
# Structured logs everywhere except a developer's terminal (CLAUDE.md 11). Boot 4 emits ECS
# JSON natively, so no logstash encoder dependency is needed.
spring:
  config:
    activate:
      on-profile: "!local & !test"

logging:
  structured:
    format:
      console: ecs

spendly:
  demo-data:
    enabled: false
