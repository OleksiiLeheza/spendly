# Spendly local stack (FI-9): infrastructure plus the application itself.
#
#   cp .env.example .env && docker compose up -d
#
# Every service has a healthcheck and the dependants wait on it, so a single
# `docker compose up -d` reaches a usable state without manual retries. The first run builds
# the service and frontend images from source; after a code change, `docker compose up -d
# --build` rebuilds them. To run one service from the IDE instead, free its port first:
# `docker compose stop user-service`.

name: spendly

# Shared shape of every Spring Boot service container. A service adds its datasource URL,
# its ports and MANAGEMENT_PORT, which the healthcheck reads at runtime ($$ keeps the
# expansion out of compose's hands).
x-spring-service: &spring-service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    databases:
      condition: service_completed_successfully
    kafka:
      condition: service_healthy
    redis:
      condition: service_healthy
    discovery-server:
      condition: service_healthy
    config-server:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${MANAGEMENT_PORT}/actuator/health/readiness"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 40s

x-spring-environment: &spring-environment
  SPENDLY_DB_USER: ${POSTGRES_USER:-spendly}
  SPENDLY_DB_PASSWORD: ${POSTGRES_PASSWORD:-spendly}
  # auth-service signs every access token with `iss` set to SPENDLY_OIDC_ISSUER, and every
  # other service checks that name against the keys it fetches from auth-service's JWKS.
  SPENDLY_OIDC_ISSUER: ${SPENDLY_OIDC_ISSUER:-http://localhost:8096}
  SPENDLY_OIDC_JWK_SET_URI: http://auth-service:8096/.well-known/jwks.json
  SPENDLY_OTLP_ENDPOINT: http://tempo:4318/v1/traces
  SPENDLY_CORS_ORIGINS: ${SPENDLY_CORS_ORIGINS:-http://localhost:4200}
  # The broker's container-side listener (see KAFKA_ADVERTISED_LISTENERS).
  SPENDLY_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  # How outbox_event reaches Kafka: `poller` (the in-service relay) or `cdc` (Debezium, which
  # needs `docker compose --profile cdc up -d`). See docs/outbox-poller-vs-debezium.md.
  SPENDLY_OUTBOX_MODE: ${SPENDLY_OUTBOX_MODE:-poller}
  SPENDLY_REDIS_URL: redis://redis:6379
  # Client-side discovery (FI-34) and central configuration (FI-33). Both are optional at
  # runtime: a service that cannot reach them keeps its packaged defaults and DNS names.
  SPENDLY_EUREKA_ENABLED: "true"
  SPENDLY_EUREKA_URL: http://discovery-server:8761/eureka/
  SPENDLY_CONFIG_SERVER_URL: http://config-server:8888
  # Demo dataset (common.demo.DemoDataProperties). Change these in .env and restart.
  SPENDLY_DEMO_DATA: ${SPENDLY_DEMO_DATA:-true}
  SPENDLY_DEMO_DATA_RESET: ${SPENDLY_DEMO_DATA_RESET:-false}
  SPENDLY_DEMO_DATA_MONTHS: ${SPENDLY_DEMO_DATA_MONTHS:-4}
  SPENDLY_DEMO_DATA_SCALE: ${SPENDLY_DEMO_DATA_SCALE:-100}

services:
  postgres:
    image: postgres:17-alpine
    container_name: spendly-postgres
    # Logical decoding is what lets Debezium read outbox_event from the WAL (FI-47). It costs a
    # little extra WAL and is harmless while the outbox mode is `poller`.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spendly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spendly}
      POSTGRES_DB: ${POSTGRES_DB:-spendly}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spendly} -d ${POSTGRES_DB:-spendly}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Creates whichever per-service databases are missing, on every `up`. Postgres runs its
  # init scripts only on an empty volume, so a database added later (a new service) would
  # otherwise never exist on a stack that was started before it. The script is idempotent.
  databases:
    image: postgres:17-alpine
    container_name: spendly-databases
    command: ["bash", "/init-databases.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spendly}
      POSTGRES_DB: ${POSTGRES_DB:-spendly}
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-spendly}
    volumes:
      - ./infra/postgres/init-databases.sh:/init-databases.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:8-alpine
    container_name: spendly-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: spendly-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-spendly}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-spendly-minio}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"     # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # MailHog was archived in 2021 and publishes no arm64 image, so Apple Silicon would
  # emulate it. Mailpit is the maintained drop-in: same job, same SMTP port, nicer UI.
  mailpit:
    image: axllent/mailpit:latest
    container_name: spendly-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_UI_PORT:-8025}:8025" # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Kafka in KRaft mode - no ZooKeeper (CLAUDE.md 5.2).
  kafka:
    image: apache/kafka:4.1.0
    container_name: spendly-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      # Two advertised listeners: containers reach the broker as kafka:19092, the host as
      # localhost:9092. A single listener cannot satisfy both and produces the classic
      # "connects, then times out on produce" failure.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: spendly-local-cluster-0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # Governs the event contracts, it does not carry them: messages stay plain JSON with
  # spendly-event-* headers, so no producer or consumer links a registry client (FI-45).
  # The committed schemas are registered from inside this container by register.sh, which
  # runs beside the registry; a history that breaks BACKWARD compatibility fails the script
  # and leaves the container unhealthy instead of being skipped.
  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.4
    container_name: spendly-schema-registry
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:19092
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    command: ["bash", "-c", "bash /register.sh & exec /etc/confluent/docker/run"]
    ports:
      - "${SCHEMA_REGISTRY_PORT:-8094}:8081"
    volumes:
      - ./events/src/main/resources/schemas:/schemas:ro
      - ./infra/schema-registry/register.sh:/register.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/schemas-registered && curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # The CDC alternative to the outbox poller (FI-47). Opt-in: `docker compose --profile cdc up -d`
  # together with SPENDLY_OUTBOX_MODE=cdc. Without the profile and with the mode set to cdc,
  # nothing publishes outbox_event, so events stop flowing.
  debezium-connect:
    image: quay.io/debezium/connect:3.6.3.Final
    container_name: spendly-debezium-connect
    profiles: ["cdc"]
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: spendly-connect
      CONFIG_STORAGE_TOPIC: spendly.connect.configs
      OFFSET_STORAGE_TOPIC: spendly.connect.offsets
      STATUS_STORAGE_TOPIC: spendly.connect.statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      SPENDLY_DB_HOST: postgres
      SPENDLY_DB_USER: ${POSTGRES_USER:-spendly}
      SPENDLY_DB_PASSWORD: ${POSTGRES_PASSWORD:-spendly}
    command: ["bash", "-c", "bash /debezium/register-connectors.sh & exec /docker-entrypoint.sh start"]
    ports:
      - "${DEBEZIUM_CONNECT_PORT:-8095}:8083"
    volumes:
      - ./infra/debezium:/debezium:ro
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/connectors-registered && curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: spendly-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: spendly-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "${KAFKA_UI_PORT:-8099}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: spendly-prometheus
    command:
      - --config.file=/etc/spendly/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/observability:/etc/spendly:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: spendly-loki
    command: -config.file=/etc/spendly/loki-config.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./infra/observability:/etc/spendly:ro
      - loki-data:/loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    container_name: spendly-tempo
    command: -config.file=/etc/spendly/tempo-config.yml
    ports:
      - "${TEMPO_PORT:-3200}:3200"
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./infra/observability:/etc/spendly:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: spendly-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/observability/grafana-provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

  # --- Platform ------------------------------------------------------------------------
  # Eureka, the config server and the gateway. They come up before the domain services, which
  # wait on their healthchecks.

  discovery-server:
    build:
      context: .
      args:
        SERVICE: discovery-server
    image: spendly/discovery-server:local
    container_name: spendly-discovery-server
    restart: unless-stopped
    environment:
      MANAGEMENT_PORT: 9761
      SPENDLY_EUREKA_HOSTNAME: discovery-server
    ports:
      - "${DISCOVERY_SERVER_PORT:-8761}:8761"
      - "127.0.0.1:${DISCOVERY_SERVER_MANAGEMENT_PORT:-9761}:9761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${MANAGEMENT_PORT}/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  config-server:
    build:
      context: .
      args:
        SERVICE: config-server
    image: spendly/config-server:local
    container_name: spendly-config-server
    restart: unless-stopped
    environment:
      MANAGEMENT_PORT: 9888
      # Seeded from the packaged infra/config-repo on startup and served over file://.
      SPENDLY_CONFIG_REPO_DIR: /var/spendly/config-repo
    volumes:
      - config-repo-data:/var/spendly
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"
      - "127.0.0.1:${CONFIG_SERVER_MANAGEMENT_PORT:-9888}:9888"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${MANAGEMENT_PORT}/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # The only public entry point (CLAUDE.md 3): routing, JWT validation, CORS, correlation ids
  # and per-subject rate limiting in Redis. The browser talks to this.
  api-gateway:
    <<: *spring-service
    build:
      context: .
      args:
        SERVICE: api-gateway
    image: spendly/api-gateway:local
    container_name: spendly-api-gateway
    environment:
      <<: *spring-environment
      SPENDLY_AUTH_URL: lb://auth-service
      SPENDLY_USER_URL: lb://user-service
      SPENDLY_ACCOUNT_URL: lb://account-service
      SPENDLY_TRANSACTION_URL: lb://transaction-service
      SPENDLY_BUDGET_URL: lb://budget-service
      SPENDLY_RECURRING_URL: lb://recurring-service
      SPENDLY_IMPORT_URL: lb://import-service
      SPENDLY_ANALYTICS_URL: lb://analytics-service
      SPENDLY_GOAL_URL: lb://goal-service
      SPENDLY_NOTIFICATION_URL: lb://notification-service
      SPENDLY_RATE_LIMIT_PER_MINUTE: ${SPENDLY_RATE_LIMIT_PER_MINUTE:-300}
      MANAGEMENT_PORT: 9081
    ports:
      - "${API_GATEWAY_PORT:-8081}:8081"
      - "127.0.0.1:${API_GATEWAY_MANAGEMENT_PORT:-9082}:9081"

  # --- Application ---------------------------------------------------------------------
  # Built from source by the root Dockerfile (one image per SERVICE build arg) and
  # frontend/Dockerfile. Public ports match the host-run defaults (CLAUDE.md 3), management
  # ports are published on loopback only.

  # Sign-in (password + authenticator app, or Google) and the access tokens everything else validates.
  auth-service:
    <<: *spring-service
    build:
      context: .
      args:
        SERVICE: auth-service
    image: spendly/auth-service:local
    container_name: spendly-auth-service
    environment:
      <<: *spring-environment
      SPENDLY_AUTH_DB_URL: jdbc:postgresql://postgres:5432/spendly_auth
      # Seals TOTP secrets and the signing key at rest. This default is for the local stack only;
      # set your own (openssl rand -base64 32) anywhere that holds real accounts.
      SPENDLY_AUTH_ENCRYPTION_KEY: ${SPENDLY_AUTH_ENCRYPTION_KEY:-MzizKO5/kHMGN0FE1dsFVRtlWQjSzDyKXUz9UnvPi0U=}
      SPENDLY_FRONTEND_URL: http://localhost:${FRONTEND_PORT:-4200}
      SPENDLY_PUBLIC_URL: http://localhost:${API_GATEWAY_PORT:-8081}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MANAGEMENT_PORT: 9096
    ports:
      - "${AUTH_SERVICE_PORT:-8096}:8096"
      - "127.0.0.1:${AUTH_SERVICE_MANAGEMENT_PORT:-9096}:9096"

  user-service:
    <<: *spring-service
    build:
      context: .
      args:
        SERVICE: user-service
    image: spendly/user-service:local
    container_name: spendly-user-service
    environment:
      <<: *spring-environment
      SPENDLY_USER_DB_URL: jdbc:postgresql://postgres:5432/spendly_user
      MANAGEMENT_PORT: 9091
    ports:
      - "${USER_SERVICE_PORT:-8082}:8082"
      - "127.0.0.1:${USER_SERVICE_MANAGEMENT_PORT:-9091}:9091"

  account-service:
    <<: *spring-service
    build:
      context: .
      args:
        SERVICE: account-service
    image: spendly/account-service:local
    container_name: spendly-account-service
    environment:
      <<: *spring-environment
      SPENDLY_ACCOUNT_DB_URL: jdbc:postgresql://postgres:5432/spendly_account
      MANAGEMENT_PORT: 9083
    ports:
      - "${ACCOUNT_SERVICE_PORT:-8083}:8083"
      - "127.0.0.1:${ACCOUNT_SERVICE_MANAGEMENT_PORT:-9083}:9083"

  transaction-service:
    <<: *spring-service
    build:
      context: .
      args:
        SERVICE: transaction-service
    image: spendly/transaction-service:local
    container_name: spendly-transaction-service
    environment:
      <<: *spring-environment
      SPENDLY_TRANSACTION_DB_URL: jdbc:postgresql://postgres:5432/spendly_transaction
      MANAGEMENT_PORT: 9084
    ports:
      - "${TRANSACTION_SERVICE_PORT:-8084}:8084"
      - "127.0.0.1:${TRANSACTION_SERVICE_MANAGEMENT_PORT:-9084}:9084"

  budget-service:
    <<: *spring-service
    build:
      context: .
      args:
        SERVICE: budget-service
    image: spendly/budget-service:local
    container_name: spendly-budget-service
    environment:
      <<: *spring-environment
      SPENDLY_BUDGET_DB_URL: jdbc:postgresql://postgres:5432/spendly_budget
      MANAGEMENT_PORT: 9085
    ports:
      - "${BUDGET_SERVICE_PORT:-8085}:8085"
      - "127.0.0.1:${BUDGET_SERVICE_MANAGEMENT_PORT:-9085}:9085"

  recurring-service:
    <<: *spring-service
    build:
      context: .
      args:
        SERVICE: recurring-service
    image: spendly/recurring-service:local
    container_name: spendly-recurring-service
    environment:
      <<: *spring-environment
      SPENDLY_RECURRING_DB_URL: jdbc:postgresql://postgres:5432/spendly_recurring
      MANAGEMENT_PORT: 9087
    ports:
      - "${RECURRING_SERVICE_PORT:-8087}:8087"
      - "127.0.0.1:${RECURRING_SERVICE_MANAGEMENT_PORT:-9087}:9087"

  # Savings goals: round-ups and scheduled contributions, driven by the ledger event stream.
  goal-service:
    <<: *spring-service
    build:
      context: .
      args:
        SERVICE: goal-service
    image: spendly/goal-service:local
    container_name: spendly-goal-service
    environment:
      <<: *spring-environment
      SPENDLY_GOAL_DB_URL: jdbc:postgresql://postgres:5432/spendly_goal
      MANAGEMENT_PORT: 9086
    ports:
      - "${GOAL_SERVICE_PORT:-8086}:8086"
      - "127.0.0.1:${GOAL_SERVICE_MANAGEMENT_PORT:-9086}:9086"

  # Inbox, email and web push. Mail goes to Mailpit locally; the management port is 9191
  # because 9091 already belongs to user-service, which predates the port rule.
  notification-service:
    <<: *spring-service
    build:
      context: .
      args:
        SERVICE: notification-service
    image: spendly/notification-service:local
    container_name: spendly-notification-service
    depends_on:
      postgres:
        condition: service_healthy
      databases:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      <<: *spring-environment
      SPENDLY_NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/spendly_notification
      SPENDLY_SMTP_HOST: mailpit
      SPENDLY_SMTP_PORT: "1025"
      SPENDLY_PUBLIC_URL: http://localhost:${FRONTEND_PORT:-4200}
      SPENDLY_VAPID_PUBLIC_KEY: ${SPENDLY_VAPID_PUBLIC_KEY:-}
      SPENDLY_VAPID_PRIVATE_KEY: ${SPENDLY_VAPID_PRIVATE_KEY:-}
      MANAGEMENT_PORT: 9191
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8091}:8091"
      - "127.0.0.1:${NOTIFICATION_SERVICE_MANAGEMENT_PORT:-9191}:9191"

  # Receipts go straight from the browser to MinIO through presigned URLs, so the public
  # storage endpoint is the host-facing MinIO port while the service itself talks to minio:9000.
  import-service:
    <<: *spring-service
    build:
      context: .
      args:
        SERVICE: import-service
    image: spendly/import-service:local
    container_name: spendly-import-service
    depends_on:
      postgres:
        condition: service_healthy
      databases:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *spring-environment
      SPENDLY_IMPORT_DB_URL: jdbc:postgresql://postgres:5432/spendly_import
      SPENDLY_STORAGE_ENDPOINT: http://minio:9000
      SPENDLY_STORAGE_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
      SPENDLY_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-spendly}
      SPENDLY_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-spendly-minio}
      MANAGEMENT_PORT: 9088
    ports:
      - "${IMPORT_SERVICE_PORT:-8088}:8088"
      - "127.0.0.1:${IMPORT_SERVICE_MANAGEMENT_PORT:-9088}:9088"

  # The read side (CLAUDE.md 6.8): one call that answers the dashboard, fanning out to the
  # domain services behind Resilience4j, and serves the insights from a read model it builds from
  # the ledger event stream in its own database.
  analytics-service:
    <<: *spring-service
    build:
      context: .
      args:
        SERVICE: analytics-service
    image: spendly/analytics-service:local
    container_name: spendly-analytics-service
    environment:
      <<: *spring-environment
      SPENDLY_ANALYTICS_DB_URL: jdbc:postgresql://postgres:5432/spendly_analytics
      # lb:// resolves through Eureka with client-side load balancing (FI-34/FI-35); the
      # compose DNS name still works and is what a host-run analytics-service uses.
      SPENDLY_ACCOUNT_URL: lb://account-service
      SPENDLY_BUDGET_URL: lb://budget-service
      SPENDLY_RECURRING_URL: lb://recurring-service
      SPENDLY_TRANSACTION_URL: lb://transaction-service
      MANAGEMENT_PORT: 9090
    ports:
      - "${ANALYTICS_SERVICE_PORT:-8090}:8090"
      - "127.0.0.1:${ANALYTICS_SERVICE_MANAGEMENT_PORT:-9089}:9090"

  # Shared-expense groups, invitations by link, the split engine and debt simplification.
  sharing-service:
    <<: *spring-service
    build:
      context: .
      args:
        SERVICE: sharing-service
    image: spendly/sharing-service:local
    container_name: spendly-sharing-service
    environment:
      <<: *spring-environment
      SPENDLY_SHARING_DB_URL: jdbc:postgresql://postgres:5432/spendly_sharing
      MANAGEMENT_PORT: 9093
    ports:
      - "${SHARING_SERVICE_PORT:-8093}:8093"
      - "127.0.0.1:${SHARING_SERVICE_MANAGEMENT_PORT:-9093}:9093"

  # nginx serving the production Angular bundle. The browser talks to the gateway
  # through its published host port, exactly as with `ng serve`.
  frontend:
    build: ./frontend
    image: spendly/frontend:local
    container_name: spendly-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  config-repo-data:
  redis-data:
  minio-data:
  kafka-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
