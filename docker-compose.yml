# Spendly local stack (FI-9): infrastructure plus the application itself.
#
#   cp .env.example .env && docker compose up -d
#
# Every service has a healthcheck and the dependants wait on it, so a single
# `docker compose up -d` reaches a usable state without manual retries. The first run builds
# the service and frontend images from source; after a code change, `docker compose up -d
# --build` rebuilds them. To run one service from the IDE instead, free its port first:
# `docker compose stop user-service`.

name: spendly

# Shared shape of every Spring Boot service container. A service adds its datasource URL,
# its ports and MANAGEMENT_PORT, which the healthcheck reads at runtime ($$ keeps the
# expansion out of compose's hands).
x-spring-service: &spring-service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    keycloak:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${MANAGEMENT_PORT}/actuator/health/readiness"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 40s

x-spring-environment: &spring-environment
  SPENDLY_DB_USER: ${POSTGRES_USER:-spendly}
  SPENDLY_DB_PASSWORD: ${POSTGRES_PASSWORD:-spendly}
  # Tokens are minted for the browser, so their `iss` is the host-facing Keycloak URL (pinned
  # by KC_HOSTNAME below). A container cannot reach localhost:8080, so the signing keys come
  # from the compose network name instead; see spring.security.oauth2 in application.yaml.
  SPENDLY_OIDC_ISSUER: ${SPENDLY_OIDC_ISSUER:-http://localhost:8080/realms/spendly}
  SPENDLY_OIDC_JWK_SET_URI: http://keycloak:8080/realms/spendly/protocol/openid-connect/certs
  SPENDLY_OTLP_ENDPOINT: http://tempo:4318/v1/traces
  SPENDLY_CORS_ORIGINS: ${SPENDLY_CORS_ORIGINS:-http://localhost:4200}

services:
  postgres:
    image: postgres:17-alpine
    container_name: spendly-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spendly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spendly}
      POSTGRES_DB: ${POSTGRES_DB:-spendly}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spendly} -d ${POSTGRES_DB:-spendly}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: spendly-keycloak
    # start-dev keeps the realm in Postgres but relaxes TLS and hostname checks.
    # --import-realm replays infra/keycloak on an empty database: realm-as-code (FI-10).
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-spendly}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-spendly}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      # Pins the issuer to the host-facing URL whichever hostname a request arrives on, so
      # every token carries the `iss` the services validate (SPENDLY_OIDC_ISSUER).
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      # Substituted into realm-spendly.json at import time.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-google-client-id-not-set}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-google-client-secret-not-set}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image ships neither curl nor wget, so the probe talks HTTP over bash's
      # /dev/tcp against the management port. CRLF line endings are required - plain
      # \n makes Keycloak answer 400.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "\"status\": \"UP\"" <&3'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: spendly-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: spendly-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-spendly}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-spendly-minio}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"     # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: creates the receipts bucket MinIO needs for FI-18, then exits.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: spendly-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-spendly}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-spendly-minio}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/spendly-receipts &&
      mc anonymous set none local/spendly-receipts &&
      echo 'MinIO bucket ready: spendly-receipts'
      "
    restart: "no"

  # MailHog was archived in 2021 and publishes no arm64 image, so Apple Silicon would
  # emulate it. Mailpit is the maintained drop-in: same job, same SMTP port, nicer UI.
  mailpit:
    image: axllent/mailpit:latest
    container_name: spendly-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_UI_PORT:-8025}:8025" # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Kafka in KRaft mode - no ZooKeeper (CLAUDE.md 5.2).
  kafka:
    image: apache/kafka:4.1.0
    container_name: spendly-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      # Two advertised listeners: containers reach the broker as kafka:19092, the host as
      # localhost:9092. A single listener cannot satisfy both and produces the classic
      # "connects, then times out on produce" failure.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: spendly-local-cluster-0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: spendly-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: spendly-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "${KAFKA_UI_PORT:-8099}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: spendly-prometheus
    command:
      - --config.file=/etc/spendly/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/observability:/etc/spendly:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: spendly-loki
    command: -config.file=/etc/spendly/loki-config.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./infra/observability:/etc/spendly:ro
      - loki-data:/loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    container_name: spendly-tempo
    command: -config.file=/etc/spendly/tempo-config.yml
    ports:
      - "${TEMPO_PORT:-3200}:3200"
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./infra/observability:/etc/spendly:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: spendly-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/observability/grafana-provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

  # --- Application ---------------------------------------------------------------------
  # Built from source by the root Dockerfile (one image per SERVICE build arg) and
  # frontend/Dockerfile. Public ports match the host-run defaults (CLAUDE.md 3), management
  # ports are published on loopback only.

  user-service:
    <<: *spring-service
    build:
      context: .
      args:
        SERVICE: user-service
    image: spendly/user-service:local
    container_name: spendly-user-service
    environment:
      <<: *spring-environment
      SPENDLY_USER_DB_URL: jdbc:postgresql://postgres:5432/spendly_user
      MANAGEMENT_PORT: 9091
    ports:
      - "${USER_SERVICE_PORT:-8082}:8082"
      - "127.0.0.1:${USER_SERVICE_MANAGEMENT_PORT:-9091}:9091"

  account-service:
    <<: *spring-service
    build:
      context: .
      args:
        SERVICE: account-service
    image: spendly/account-service:local
    container_name: spendly-account-service
    environment:
      <<: *spring-environment
      SPENDLY_ACCOUNT_DB_URL: jdbc:postgresql://postgres:5432/spendly_account
      MANAGEMENT_PORT: 9083
    ports:
      - "${ACCOUNT_SERVICE_PORT:-8083}:8083"
      - "127.0.0.1:${ACCOUNT_SERVICE_MANAGEMENT_PORT:-9083}:9083"

  transaction-service:
    <<: *spring-service
    build:
      context: .
      args:
        SERVICE: transaction-service
    image: spendly/transaction-service:local
    container_name: spendly-transaction-service
    environment:
      <<: *spring-environment
      SPENDLY_TRANSACTION_DB_URL: jdbc:postgresql://postgres:5432/spendly_transaction
      MANAGEMENT_PORT: 9084
    ports:
      - "${TRANSACTION_SERVICE_PORT:-8084}:8084"
      - "127.0.0.1:${TRANSACTION_SERVICE_MANAGEMENT_PORT:-9084}:9084"

  # nginx serving the production Angular bundle. The browser talks to Keycloak and the
  # services through their published host ports, exactly as with `ng serve`.
  frontend:
    build: ./frontend
    image: spendly/frontend:local
    container_name: spendly-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  kafka-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
