global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Services run on the host during development, not in compose, so Prometheus reaches
  # them through the Docker host gateway rather than a compose service name.
  - job_name: spendly-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'host.docker.internal:9091'   # user-service management port
        labels:
          stack: spendly
