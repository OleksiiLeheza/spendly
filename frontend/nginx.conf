# Serves the Angular SPA. Every deep link (/dashboard, /callback after Keycloak redirects
# back) falls through to index.html so the Angular router can take over.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Angular hashes every bundle name (outputHashing: all), so those files can be cached
    # forever; index.html must not be, or a redeploy keeps serving the old chunk names.
    location ~* \.(?:js|css|woff2?|ttf|ico|svg|png|jpg|webp)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
